plugins { id 'net.fabricmc.fabric-loom' version '1.18.2' }
version = project.mod_version
group = 'dev.chatsorter'
base { archivesName = 'chatsorter' }
repositories { mavenCentral() }
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 implementation "net.fabricmc:fabric-loader:${project.loader_version}"
 implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // RE2/J provides linear-time matching; user supplied filters are never run
    // through Java's backtracking regex engine on the client thread.
    include implementation('com.google.re2j:re2j:1.8')
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8'; options.compilerArgs.addAll(['-Xmaxerrs','1000']) }
java { toolchain.languageVersion = JavaLanguageVersion.of(25) }

// Geometry checks run without a game window and without an extra test framework.
sourceSets {
    hologramTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
tasks.register('testHologramLayout', JavaExec) {
    dependsOn hologramTestClasses
    classpath = sourceSets.hologramTest.runtimeClasspath
    mainClass = 'dev.chatsorter.ChatHologramLayoutTest'
}
tasks.register('testHologramQuads', JavaExec) {
    dependsOn hologramTestClasses
    classpath = sourceSets.hologramTest.runtimeClasspath
    mainClass = 'dev.chatsorter.ChatHologramQuadTest'
}
tasks.named('check') { dependsOn 'testHologramLayout', 'testHologramQuads' }

// Prefer Maven Central for shared Java libraries instead of probing game repositories.
afterEvaluate {
    def central = repositories.find { it.name == 'MavenRepo' }
    if (central != null) { repositories.remove(central); repositories.addFirst(central) }
}
