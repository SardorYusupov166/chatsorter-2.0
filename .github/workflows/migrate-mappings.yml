name: Build ChatSorter 2.0 for Minecraft 26.2
on:
  push:
    branches: ['port/mc26.2']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: Compile all sources with expanded diagnostics
        shell: bash
        run: |
          set -o pipefail
          gradle compileJava --console=plain --no-daemon 2>&1 | tee compile-log.txt
      - name: Run checks and package mod
        if: success()
        shell: bash
        run: |
          set -o pipefail
          gradle build --console=plain --no-daemon 2>&1 | tee build-log.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatsorter-2.0-mc26.2-diagnostics
          path: |
            compile-log.txt
            build-log.txt
          if-no-files-found: warn
      - name: Upload Minecraft 26.2 mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chatsorter-2.0-mc26.2
          path: build/libs/*.jar
          if-no-files-found: error
